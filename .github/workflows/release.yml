name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(grep '^version' pack/pack.toml | sed 's/.*"\(.*\)".*/\1/')"
            echo "Manual run: using pack.toml version → ${tag#v}"
          fi
          version="${tag#v}"
          if [[ -z "$version" ]]; then
            echo "Could not determine release version from tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify pack.toml version matches tag
        if: github.event_name == 'release' || github.event_name == 'push'
        run: |
          pack_version="$(grep '^version' pack/pack.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [[ "${{ steps.version.outputs.version }}" != "$pack_version" ]]; then
            echo "Tag v${{ steps.version.outputs.version }} does not match pack.toml version $pack_version" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Build release artifacts
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-release.sh

      - name: Publish to GitHub Release (existing release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/Fabulously-Create-${{ steps.version.outputs.version }}.mrpack
            dist/release/Fabulously-Create-Server-${{ steps.version.outputs.version }}.zip
            dist/release/Fabulously-Create-Prism-${{ steps.version.outputs.version }}.zip
          overwrite_files: true

      - name: Publish to GitHub Release (tag push or manual)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fabulously Create ${{ steps.version.outputs.version }}
          files: |
            dist/release/Fabulously-Create-${{ steps.version.outputs.version }}.mrpack
            dist/release/Fabulously-Create-Server-${{ steps.version.outputs.version }}.zip
            dist/release/Fabulously-Create-Prism-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          overwrite_files: true
          make_latest: true

      - name: Check Modrinth config
        id: modrinth
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [[ -n "$MODRINTH_PROJECT_ID" && -n "$MODRINTH_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Modrinth upload (optional). Set MODRINTH_PROJECT_ID and MODRINTH_TOKEN to enable."
          fi

      - name: Publish to Modrinth
        if: steps.modrinth.outputs.enabled == 'true'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          name: Fabulously Create ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog: ${{ github.event.release.body || format('Release {0}', steps.version.outputs.version) }}
          loaders: neoforge
          game-versions: 1.21.1
          files: '["dist/release/Fabulously-Create-${{ steps.version.outputs.version }}.mrpack", "dist/release/Fabulously-Create-Server-${{ steps.version.outputs.version }}.zip"]'
